			<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.10/styles/dracula.min.css">
			<!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.10/styles/default.min.css"> -->
			<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.10/highlight.min.js"></script>
			<script>

			const elements = document.getElementsByClassName('markdownx');
			for (element of elements) {
    			element.addEventListener('markdownx.update', event => {
        			for (const block of document.querySelectorAll('pre code')) {
            			hljs.highlightBlock(block);
        			}
    			});
			}
			</script>
